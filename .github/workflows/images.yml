# Vorgebaute Images für Home Assistant (ghcr.io/<owner>/<arch>-addon-katzenfutter:<version>).
# Läuft, wenn sich katzenfutter/config.yaml ändert (Versionssprung) oder von Hand.
name: Images

on:
  push:
    branches: [main]
    paths:
      - katzenfutter/**
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            plattform: linux/arm64
          - arch: amd64
            plattform: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - name: Version aus config.yaml
        id: version
        run: echo "version=$(yq '.version' katzenfutter/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: katzenfutter
          platforms: ${{ matrix.plattform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-katzenfutter:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-katzenfutter:latest
          labels: |
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=app
            io.hass.arch=${{ matrix.arch }}
            io.hass.name=Katzenfutter
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
